  .frame { border:1px solid var(--border); border-top:0; border-radius:0 0 12px 12px; overflow:hidden; background:#f5f5f7; }
  iframe { display:block; width:100%; height:640px; border:0; }
  pre { margin:0; padding:20px; white-space:pre-wrap; font:13px/1.6 Menlo, Consolas, monospace; background:#fff; min-height:300px; }
  @media (max-width: 760px) { .wrap { display:block; } nav { width:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--border); } main { padding:16px; } }
